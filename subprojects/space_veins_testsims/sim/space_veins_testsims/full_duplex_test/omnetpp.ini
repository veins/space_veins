[General]
##########################################################
#            Simulation parameters                       #
##########################################################
sim-time-limit = ${simTimeLimit=79}s
repeat = 1
debug-on-errors = true
print-undisposed = true
# cmdenv-express-mode = false #for complete debug output
# cmdenv-express-mode = true for max computation speed
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 1s
cmdenv-log-prefix = "[%l]\t[%J]:[%t]\t"
cmdenv-event-banners = false
cmdenv-redirect-output = false
image-path = ../../images

network = SatelliteExampleScenario
*.playgroundSizeX = 1000m
*.playgroundSizeY = 1000m
*.playgroundSizeZ = 1000km

##########################################################
#            TraCIScenarioManager parameters             #
##########################################################
*.manager.autoShutdown = true
*.manager.updateInterval = 0.1s
*.manager.moduleType = "space_veins.nodes.SatCar"
*.manager.moduleName = "node"
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.launchConfig = xmldoc("Null-Island-3by3-grid.launchd.xml")

##########################################################
#                    VehicleInserter                     #
##########################################################
*.vehicleInserter.numVehicles = ${numVehicles=1}

##########################################################
#                 Physical environment                   #
##########################################################
*.physicalEnvironment.ground.typename = "FlatGround"

##########################################################
#                        SOP                             #
##########################################################
*.sop.sumoNetXmlFile = xmldoc("Null-Island-3by3-grid.net.xml")
*.sop.mobility.updateFromDisplayString = false
*.sop.mobility.initFromDisplayString = false
*.sop.mobility.initialX = 400m
*.sop.mobility.initialY = 397.49m
*.sop.mobility.initialZ = 0m

##########################################################
#                    Statistics                          #
##########################################################

# Disable all remaining result recording
**.scalar-recording = false
**.vector-recording = false

##########################################################
#                  SatelliteInserter                     #
##########################################################
*.satelliteInserter.pathToTleFile = "space_Veins-1.txt"
*.satelliteInserter.ignoreUnknownSatellites = false
*.satelliteInserter.wall_clock_sim_start_time_utc = "2022-02-22-13-42-34"

##########################################################
#                       Satellite                        #
##########################################################
# MOBILITY
*.leo*[*].mobility.typename = "SGP4Mobility"
*.leo*[*].mobility.updateDisplayString = true
*.leo*[*].mobility.updateInterval = 1s

# APPLICATION
*.leo*[*].numApps = 1
*.leo*[*].app[0].typename = "UdpBasicAppTesting"
*.leo*[*].app[0].destAddresses = "224.0.0.1"
# startTime should be after the vehicle is inserted otherwise a synchronization effect takes place
# If startTime < simTime(), the vehicle immediately transmits a packet.
# If several vehicles are inserted at the same time, all vehicles generate packets at the same point in time
*.leo*[*].app[0].packetName = "UDPData-"
*.leo*[*].app[0].destPort = 5000
*.leo*[*].app[0].localPort = 5000
*.leo*[*].app[0].messageLength = ${payloadSize=1000}B
*.leo*[*].app[0].multicastInterface = "satNic0"
*.leo*[*].app[0].receiveBroadcast = true
*.leo*[*].app[0].joinLocalMulticastGroups = true

# IPV4
*.leo*[*].ipv4.arp.typename ="GlobalArp"
*.leo*[*].ipv4.configurator.typename = "HostAutoConfigurator"
*.leo*[*].ipv4.configurator.interfaces = "satNic0"
*.leo*[*].ipv4.configurator.mcastGroups = "224.0.0.1"

# Disable Loopback interface
*.leo*[*].numLoInterfaces = 0

# SATELLITE_NIC
*.leo*[*].numSatelliteNics = 1
*.leo*[*].satNic[0].typename = "SatelliteInterface"
# -- SATELLITE_NIC_MAC
*.leo*[*].satNic[0].mac.typename = "AckingMac"
*.leo*[*].satNic[0].mac.bitrate = 100Mbps
*.leo*[*].satNic[0].mac.headerLength = 32B
*.leo*[*].satNic[0].mac.useAck = true
# -- SATELLITE_NIC_PHY
*.leo*[*].satNic[0].radio.typename = "UnitDiskRadio"
*.leo*[*].satNic[0].radio.radioMediumModule = "satelliteRadioMedium"
*.leo*[*].satNic[0].radio.antenna.mobilityModule = "^.^.^.mobility"
*.leo*[*].satNic[0].radio.transmitter.communicationRange = 9999999km
*.leo*[*].satNic[0].radio.transmitter.bitrate = 100Mbps
*.leo*[*].satNic[0].radio.transmitter.headerLength = 8bit
*.leo*[*].satNic[0].radio.transmitter.preambleDuration = 0s
*.leo*[*].satNic[0].radio.receiver.ignoreInterference = true

##########################################################
#                       SatCar                           #
##########################################################
# MOBILITY
*.node[*].mobility.typename = "VeinsInetMobility"

# APPLICATION
*.node[*].numApps = 1
*.node[*].app[0].typename = "UdpBasicAppTesting"
*.node[*].app[0].destAddresses = "224.0.0.1"
# startTime should be after the vehicle is inserted otherwise a synchronization effect takes place
# If startTime < simTime(), the vehicle immediately transmits a packet.
# If several vehicles are inserted at the same time, all vehicles generate packets at the same point in time
*.node[*].app[0].packetName = "UDPData-"
*.node[*].app[0].destPort = 5000
*.node[*].app[0].localPort = 5000
*.node[*].app[0].messageLength = ${payloadSize}B
*.node[*].app[0].multicastInterface = "satNic0"
*.node[*].app[0].receiveBroadcast = true
*.node[*].app[0].joinLocalMulticastGroups = true

# IPV4
*.node[*].ipv4.arp.typename ="GlobalArp"
*.node[*].ipv4.configurator.typename = "HostAutoConfigurator"
*.node[*].ipv4.configurator.interfaces = "satNic0"
*.node[*].ipv4.configurator.mcastGroups = "224.0.0.1"

# Disable Loopback interface
*.node[*].numLoInterfaces = 0

# SAMAC_NIC
*.node[*].useSamac = false

# SATELITE_NIC
*.node[*].numSatelliteNics = 1

# Disable Wlan
*.*.numWlanInterfaces = 0

# SATELITE_NIC
*.node[*].numSatelliteNics = 1
*.node[*].satNic[0].typename = "SatelliteInterface"
# -- SATELITE_NIC_MAC
*.node[*].satNic[0].mac.typename = "AckingMac"
*.node[*].satNic[0].mac.bitrate = 100Mbps
*.node[*].satNic[0].mac.headerLength = 32B
*.node[*].satNic[0].mac.useAck = true
# -- SATELLITE_NIC_PHY
*.node[*].satNic[0].radio.typename = "UnitDiskRadio"
*.node[*].satNic[0].radio.radioMediumModule = "satelliteRadioMedium"
*.node[*].satNic[0].radio.antenna.mobilityModule = "notUsed"
*.node[*].satNic[0].radio.antenna.mobility.typename = "AttachedMobility"
*.node[*].satNic[0].radio.antenna.mobility.subjectModule = "^"
*.node[*].satNic[0].radio.antenna.mobility.mobilityModule = "^.^.^.^.mobility"
*.node[*].satNic[0].radio.antenna.mobility.constraintAreaMinX = 0m
*.node[*].satNic[0].radio.antenna.mobility.constraintAreaMinY = 0m
*.node[*].satNic[0].radio.antenna.mobility.constraintAreaMinZ = 0m
*.node[*].satNic[0].radio.antenna.mobility.constraintAreaMaxX = 2000m
*.node[*].satNic[0].radio.antenna.mobility.constraintAreaMaxY = 2000m
*.node[*].satNic[0].radio.antenna.mobility.constraintAreaMaxZ = 10m
*.node[*].satNic[0].radio.antenna.mobility.offsetZ = 1.895m
*.node[*].satNic[0].radio.transmitter.communicationRange = 9999999km
*.node[*].satNic[0].radio.transmitter.bitrate = 100Mbps
*.node[*].satNic[0].radio.transmitter.headerLength = 8bit
*.node[*].satNic[0].radio.transmitter.preambleDuration = 0s
*.node[*].satNic[0].radio.receiver.ignoreInterference = true

##########################################################
#           satellite radio medium parameters            #
##########################################################
*.satelliteRadioMedium.typename = "UnitDiskRadioMedium"
*.satelliteRadioMedium.mediumLimitCache.minElevationAngleV2S = 25deg
*.satelliteRadioMedium.mediumLimitCache.disableS2SCommunication = true

[Config Test]
# 0: fullDuplex enabled, SatCar receives transmission from LEO while the SatCar sends --> both packets received
# 1: fullDuplex enabled, LEO receives transmission from SatCar while the LEO sends --> both packets received
# 2: fullDuplex disabled, SatCar receives transmission from LEO while the SatCar sends --> only LEO receives a packet, as the SatCar's reception is interfered by LEO transmission
# 3: fullDuplex disabled, LEO receives transmission from SatCar while the LEO sends --> only SatCar receives a packet, as the LEO's reception is interfered by the SatCar transmission
*.**.app[0].testNumber = ${testNumber=0, 1, 2, 3}

# transmission offset of 1.28ms to compensate for the propagation delay
*.node[*].app[0].startTime = ${startAppSatCar= 60.00128s, 60s, 60.00128s, 60s ! testNumber}
*.leo*[*].app[0].startTime = ${startAppLeo= 60s, 60.00128s, 60s, 60.00128s! testNumber}
*.**.app[0].sendInterval = 10s

*.node[*].app[0].expectedReceivedPackets = ${expectedReceivedPacketsGroundStation= 1, 1, 0, 1 ! testNumber}
*.leo*[*].app[0].expectedReceivedPackets = ${expectedReceivedPacketsLeo= 1, 1, 1, 0 ! testNumber}
*.node[*].app[0].expectedSentPackets = 1
*.leo*[*].app[0].expectedSentPackets = 1

*.**.satNic[0].mac.fullDuplex = ${enableFullDuplex = true, true, false, false ! testNumber}
