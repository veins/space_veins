[General]
##########################################################
#            Simulation parameters                       #
##########################################################
sim-time-limit = ${simTimeLimit=200}s
repeat = 1
debug-on-errors = true
print-undisposed = true
#cmdenv-express-mode = false #for complete debug output --> required by the runall script
cmdenv-express-mode = false
cmdenv-autoflush = true
cmdenv-status-frequency = 1s
cmdenv-log-prefix = "[%l]\t[%J]:[%t]\t"
cmdenv-event-banners = false
cmdenv-redirect-output = false
image-path = ../../images

network = SatelliteExampleScenario
*.playgroundSizeX = 1000m
*.playgroundSizeY = 1000m
*.playgroundSizeZ = 1000km

##########################################################
#            TraCIScenarioManager parameters             #
##########################################################
*.manager.autoShutdown = true
*.manager.updateInterval = 0.1s
*.manager.moduleType = "space_veins.nodes.SatCar"
*.manager.moduleName = "node"
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.launchConfig = xmldoc("erlangen.launchd.xml")

##########################################################
#                 Physical environment                   #
##########################################################
*.physicalEnvironment.ground.typename = "FlatGround"

##########################################################
#                   AnnotationManager                    #
##########################################################
*.annotations.draw = true

##########################################################
#                    Visualization                       #
##########################################################
# Do not use OSG visualizer
*.useOsg = false
*.visualizer.osgVisualizer.typename = ""

# LinkLayer
*.visualizer.*.dataLinkVisualizer[0].displayLinks = true

# Mobility
*.visualizer.*.numMobilityVisualizers = 4
# settings for the visualizing car mobility
*.visualizer.*.mobilityVisualizer[0].moduleFilter = "*.node[*].mobility"

# settings for the visualizing leo mobility
*.visualizer.*.mobilityVisualizer[1].moduleFilter = "*.leo*[*].mobility"
*.visualizer.*.mobilityVisualizer[1].displayMovementTrails = true
*.visualizer.*.mobilityVisualizer[1].trailLength = 1000
*.visualizer.*.mobilityVisualizer[1].trailWidth = 10

# settings for the satNic antennas
*.visualizer.*.mobilityVisualizer[2].moduleFilter = "**.satNic[*].radio.antenna.mobility"
*.visualizer.*.mobilityVisualizer[2].displayPositions = true
*.visualizer.*.mobilityVisualizer[2].positionCircleFillColor = "red"
*.visualizer.*.mobilityVisualizer[2].positionCircleLineColor = "red"

# settings for the wlan antennas
*.visualizer.*.mobilityVisualizer[3].moduleFilter = "**.wlan[*].radio.antenna.mobility"
*.visualizer.*.mobilityVisualizer[3].displayPositions = true
*.visualizer.*.mobilityVisualizer[3].positionCircleFillColor = "blue"
*.visualizer.*.mobilityVisualizer[3].positionCircleLineColor = "blue"

##########################################################
#                        SOP                             #
##########################################################
*.sop.sumoNetXmlFile = xmldoc("erlangen.net.xml")
*.sop.mobility.updateFromDisplayString = false
*.sop.mobility.initFromDisplayString = false
*.sop.mobility.initialX = 0m
*.sop.mobility.initialY = 0m
*.sop.mobility.initialZ = 0m

##########################################################
#           satellite radio medium parameters            #
##########################################################
*.satelliteRadioMedium.typename = "UnitDiskRadioMedium"
*.satelliteRadioMedium.mediumLimitCache.minElevationAngleV2S = 25deg
*.satelliteRadioMedium.mediumLimitCache.disableS2SCommunication = true


##########################################################
#                    Statistics                          #
##########################################################
*.leo*[*].mobility.omnetCoordX:vector.vector-recording = true
*.leo*[*].mobility.omnetCoordY:vector.vector-recording = true
*.leo*[*].mobility.omnetCoordZ:vector.vector-recording = true
# Disable all remaining result recording
**.scalar-recording = false
**.vector-recording = false

##########################################################
#                  SatelliteInserter                     #
##########################################################
*.satelliteInserter.pathToTleFile = "demosat.txt"
*.satelliteInserter.ignoreUnknownSatellites = false
*.satelliteInserter.wall_clock_sim_start_time_utc = ${utcDate= "2025-12-31-00-12-15"}

##########################################################
#                       Satellite                        #
##########################################################
# MOBILITY
*.leo*[*].mobility.typename = "SGP4MobilityNoGetCurrentPositionUpdates"
*.leo*[*].mobility.updateDisplayString = true
*.leo*[*].mobility.updateInterval = 0.01s
*.leo*[*].mobility.runSpaceVeinsTestCode = false
*.leo*[*].mobility.useUT1 = true
*.leo*[*].mobility.pathToUt1Values = "ut1.csv"

# APPLICATION
*.leo*[*].numApps = 1
*.leo*[*].app[0].typename = "Sgp4MobilityTestApp"
*.leo*[*].app[0].localPort = 5000
*.leo*[*].app[0].testNumber = ${testNumber = 0}
*.leo*[*].app[0].pathToSkyfieldGroundTruth = "satellite_positions.csv"
*.leo*[*].app[0].pathToOmnetppCoordsGroundTruth = "omnetppCoords.csv"

# IPV4
*.leo*[*].ipv4.arp.typename ="GlobalArp"
*.leo*[*].ipv4.configurator.typename = "HostAutoConfigurator"
*.leo*[*].ipv4.configurator.interfaces = "satNic0"
*.leo*[*].ipv4.configurator.mcastGroups = "224.0.0.1"

# Disable Loopback interface
*.leo*[*].numLoInterfaces = 0

# SATELLITE_NIC
*.leo*[*].numSatelliteNics = 1
*.leo*[*].satNic[0].typename = "SatelliteInterface"
# -- SATELLITE_NIC_MAC
*.leo*[*].satNic[0].mac.typename = "AckingMac"
*.leo*[*].satNic[0].mac.bitrate = 100Mbps
*.leo*[*].satNic[0].mac.headerLength = 32B
*.leo*[*].satNic[0].mac.fullDuplex = true
*.leo*[*].satNic[0].mac.useAck = true
*.leo*[*].satNic[0].mac.isSatellite = true
# -- SATELLITE_NIC_PHY
*.leo*[*].satNic[0].radio.typename = "UnitDiskRadio"
*.leo*[*].satNic[0].radio.radioMediumModule = "satelliteRadioMedium"
*.leo*[*].satNic[0].radio.antenna.mobilityModule = "^.^.^.mobility"
*.leo*[*].satNic[0].radio.transmitter.communicationRange = 9999999km
*.leo*[*].satNic[0].radio.transmitter.bitrate = 100Mbps
*.leo*[*].satNic[0].radio.transmitter.headerLength = 8bit
*.leo*[*].satNic[0].radio.transmitter.preambleDuration = 0s
*.leo*[*].satNic[0].radio.receiver.ignoreInterference = true

[Config Test]