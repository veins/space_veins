name: Gitea Actions Demo
run-name: ${{ gitea.actor }} is testing out Gitea Actions 🚀
on: [push]

jobs:
  Explore-Gitea-Actions:
    runs-on: nsm-gitea-runner
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ gitea.event_name }} event."
      - name: Install dependencies
        run: |
           apk update
           apk add \
              autoconf \
              automake \
              clang19 \
              conmon \
              cryptsetup \
              fuse2fs \
              git \
              fuse \
              fuse-dev \
              glib-dev \
              libseccomp-dev \
              libtool \
              make \
              pkgconf \
              runc \
              squashfs-tools \
              squashfs-tools-ng \
              shadow-uidmap \
              wget \
              zlib-dev \
              podman \
              podman-docker \
              build-base

            if command -v go version >/dev/null 2>&1; then
                echo "go is already installed"
            else
              export GO_VERSION=1.22.6 OS=linux ARCH=amd64 && \
                  wget https://dl.google.com/go/go$GO_VERSION.$OS-$ARCH.tar.gz && \
                  tar -C /usr/local -xzvf go$GO_VERSION.$OS-$ARCH.tar.gz 

                  echo $GITHUB_PATH

                  echo "$HOME/bin/go/bin" >> $GITHUB_PATH

                  export PATH=$PATH:/usr/local/go/bin

                  cat $GITHUB_PATH

            fi

            export PATH=$PATH:/usr/local/go/bin
            if command -v singularity --version >/dev/null 2>&1; then
                echo "singularity is already installed"
            else
              # Download singularity
              export SINGULARITY_VERSION=4.1.5
              wget https://github.com/sylabs/singularity/releases/download/v${SINGULARITY_VERSION}/singularity-ce-${SINGULARITY_VERSION}.tar.gz
              tar -C /usr/local -xzf singularity-ce-${SINGULARITY_VERSION}.tar.gz
              cd /usr/local/singularity-ce-${SINGULARITY_VERSION}

              echo "Compile and install"
              # Compile and install
              mkdir -p builddir
              ./mconfig --prefix=$HOME/bin/singularity && \
                  make -C ./builddir && \
                  make -C ./builddir install
            fi
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Build and run singularity container
        run: |
            export PATH=$PATH:$HOME/bin/singularity/bin
            export PATH=$PATH:/usr/local/go/bin

            echo "root:100000:65536" | tee -a /etc/subuid
            echo "root:100000:65536" | tee -a /etc/subgid

            cd ${{ gitea.workspace }}/singularity
            
            ./buildSingularityContainer.sh

            ./singularity-space_veins.sh /workspace/space_veins -- make makefiles
            ./singularity-space_veins.sh /workspace/space_veins -- make -j8
      
            ${{ gitea.workspace }}/subprojects/space_veins_testsims/configure
            ${{ gitea.workspace }}/subprojects/space_veins_testsims/make -j8
            ${{ gitea.workspace }}/subprojects/space_veins_testsims/runall
      - run: echo "🍏 This job's status is ${{ job.status }}."