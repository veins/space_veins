# ============== VERIFICATION ================
# This are the benchmark simulations with perf
[Config Verification]
extends = Iridium86Active20240304, TraCIGroundMobility, Hamburg, RunTime1Hour15SecWarmUpPeriod
# extends = Iridium86Active20240304, StationaryGroundMobility, Hamburg, RunTime30min15SecWarmUpPeriod
repeat = 4
# run as fast as possible
cmdenv-express-mode = true
# cmdenv-express-mode = false
cmdenv-performance-display = false
# cmdenv-progress-updates is not available in OMNeT++ 5
# cmdenv-progress-updates = false
# set cmdenv-status-frequency to a rather high value to disable these updates
cmdenv-status-frequency = 86400s
# Disable event banners in cmdenv
cmdenv-event-banners = false
# Disable logging in cmdenv
**.cmdenv-log-level = off
# cmdenv-log-prefix = "[%l]\t[%J]:[%t]\t"
# **.cmdenv-log-level = trace
*.leo*[*].app[0].startTime = uniform(0s, 1s)
*.globalStatistics.recordReceptions = false
*.satelliteRadioMedium.recordCommunicationLog = false
**.vector-recording = false
*.numSatCars = 0
*.enableSumo = true
# *.vehicleInserter.numVehicles = ${numVehicles=85}

