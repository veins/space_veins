[Config Starlink20240304]
extends = Starlink
# set wall clock start time to 2024-03-04-09-14-20 (-12h) compared to mean epoch to minimize the SGP4 error
*.satelliteInserter.wall_clock_sim_start_time_utc = "2024-03-04-09-14-20"

# -------------- Starlink Shells --------------

[Config StarlinkShell1And420240219]
extends = Starlink20240219
*.satelliteInserter.pathToTleFile = "StarlinkShell1And4Tle_2024-02-19T21:58:47.txt"

[Config StarlinkShell1And420240304]
extends = Starlink20240304
*.satelliteInserter.pathToTleFile = "StarlinkShell1And4Tle_2024-03-04T21:14:20.txt"

[Config StarlinkShell220240219]
extends = Starlink20240219
*.satelliteInserter.pathToTleFile = "StarlinkShell2Tle_2024-02-19T21:58:47.txt"

[Config StarlinkShell220240304]
extends = Starlink20240304
*.satelliteInserter.pathToTleFile = "StarlinkShell2Tle_2024-03-04T21:14:20.txt"

[Config StarlinkShell3And520240219]
extends = Starlink20240219
*.satelliteInserter.pathToTleFile = "StarlinkShell3And5Tle_2024-02-19T21:58:47.txt"

[Config StarlinkShell3And520240304]
extends = Starlink20240304
*.satelliteInserter.pathToTleFile = "StarlinkShell3And5Tle_2024-03-04T21:14:20.txt"

# ============== Starlink End ================

# ============== DEBUG ================
[Config Debug]
extends = VerifyDisUpPosOnlyAboveHorizonWLIP
sim-time-limit = 3620s
*.node[*].app[0].startTime = 30.783s
*.node[*].app[0].stopTime = 3620s - 5s
*.satelliteInserter.pathToTleFile = "Iridium86ActiveTle_2024-03-04T21:23:14_debug.txt"
*.satelliteRadioMedium.recordCommunicationLog = true
record-eventlog = true

# ============== Debug End ================

# ============== RunTimes ================
[Config RunTime1Hour15SecWarmUpPeriod]
# 24h + warmupPeriod + coolDownPeriod (5s)
sim-time-limit = ${simTimeLimit=3620}s
warmup-period = ${warmupPeriod=15}s
*.node[*].app[0].stopTime = 3615s

[Config RunTime1Day15SecWarmUpPeriod]
# 24h + warmupPeriod + coolDownPeriod (5s)
sim-time-limit = ${simTimeLimit=86420}s
warmup-period = ${warmupPeriod=15}s
*.node[*].app[0].stopTime = 86415s

[Config RunTime1HourNoWarmUpPeriod]
# 24h + warmupPeriod + coolDownPeriod (5s)
sim-time-limit = ${simTimeLimit=3605}s
warmup-period = ${warmupPeriod=0}s
*.node[*].app[0].stopTime = 3600s

[Config RunTime1DayNoWarmUpPeriod]
# 24h + warmupPeriod + coolDownPeriod (5s)
sim-time-limit = ${simTimeLimit=86405}s
warmup-period = ${warmupPeriod=0}s
*.node[*].app[0].stopTime = 86400s

[Config OnlyInitialization]
# 24h + warmupPeriod + coolDownPeriod (5s)
sim-time-limit = ${simTimeLimit=0.001}s
warmup-period = ${warmupPeriod=0}s
*.node[*].app[0].stopTime = 1s

# ============== RunTimes End ================

# ============== VerifyUpPosOnlyAboveHorizon ================
[Config VerifyUpPosOnlyAboveHorizon]
extends = OnlyInitialization, Verification, Iridium86Active20240304, NullIsland, EnableUpdatePositionOnlyAboveHorizon, NoGetCurrentPositionUpdates

# ============== VerifyUpPosOnlyAboveHorizon End================

# ============== VERIFICATION ================
[Config Verification]
extends = Iridium86Active20240304, NullIsland
*.node[*].app[0].startTime = 0.783s
*.satelliteInserter.pathToTleFile = "Iridium86ActiveTle_2024-03-04T21:23:14_debug.txt"
*.satelliteRadioMedium.recordCommunicationLog = true
record-eventlog = true

# --------------- EnableUpdatePositionOnlyAboveHorizon ----------------
[Config VerifyEnUpPosOnlyAboveHorizonNGCP]
extends = RunTime1DayNoWarmUpPeriod, Verification, EnableUpdatePositionOnlyAboveHorizon, NoGetCurrentPositionUpdates

[Config VerifyEnUpPosOnlyAboveHorizonWGCP]
extends = RunTime1DayNoWarmUpPeriod, Verification, EnableUpdatePositionOnlyAboveHorizon, WithGetCurrentPositionUpdates

[Config VerifyEnUpPosOnlyAboveHorizonWLIP]
extends = RunTime1DayNoWarmUpPeriod, Verification, EnableUpdatePositionOnlyAboveHorizon, WithLinearInterpolationPositionUpdates

[Config VerifyEnUpPosOnlyAboveHorizonWNPP]
extends = RunTime1DayNoWarmUpPeriod, Verification, EnableUpdatePositionOnlyAboveHorizon, WithNearestPeriodicPositionUpdates

# --------------- DisableUpdatePositionOnlyAboveHorizon ----------------
[Config VerifyDisUpPosOnlyAboveHorizonNGCP]
extends = RunTime1DayNoWarmUpPeriod, Verification, DisableUpdatePositionOnlyAboveHorizon, NoGetCurrentPositionUpdates

[Config VerifyDisUpPosOnlyAboveHorizonWGCP]
extends = RunTime1DayNoWarmUpPeriod, Verification, DisableUpdatePositionOnlyAboveHorizon, WithGetCurrentPositionUpdates

[Config VerifyDisUpPosOnlyAboveHorizonWLIP]
extends = RunTime1DayNoWarmUpPeriod, Verification, DisableUpdatePositionOnlyAboveHorizon, WithLinearInterpolationPositionUpdates

[Config VerifyDisUpPosOnlyAboveHorizonWNPP]
extends = RunTime1DayNoWarmUpPeriod, Verification, DisableUpdatePositionOnlyAboveHorizon, WithNearestPeriodicPositionUpdates

# -------------- Run Type ----------------

[Config RunTimerPerformance]
repeat = 2
# Disable all result recording
**.scalar-recording = false
**.vector-recording = false

# ------------- shortcuts --------------------------------
[Config TryAndError]
extends = Debug