[General]
##########################################################
#            Simulation parameters                       #
##########################################################
debug-on-errors = true
# do not print the list of unreleased objects at the end of the simulation. It indicates that the corresponding module destructors need to be fixed.
print-undisposed = false
cmdenv-express-mode = true
cmdenv-status-frequency = 1s
# Disable event banners in cmdenv
cmdenv-event-banners = false
# Disable logging in cmdenv
**.cmdenv-log-level = off
image-path = ../../images

network = ManhattanBuildingShadowing
*.playgroundSizeX = 5000km
*.playgroundSizeY = 5000km
*.playgroundSizeZ = 9999999km

##########################################################
#            TraCIScenarioManager parameters             #
##########################################################
*.manager.autoShutdown = true
*.manager.updateInterval = 0.1s
*.manager.moduleType = "space_veins.nodes.SatCar"
*.manager.typename = "VeinsInetManager"
*.manager.configFile = "Null-Island-5by5-grid.sumo.cfg"
*.manager.launchConfig = xmldoc("sumoScenarios/nullIsland/Null-Island-5by5-grid.launchd.xml")
# ensure to have the same mobility all the time
*.manager.seed = 0

##########################################################
#                 Physical environment                   #
##########################################################
*.physicalEnvironment.ground.typename = "FlatGround"

##########################################################
#                   AnnotationManager                    #
##########################################################
*.annotations.draw = true

##########################################################
#                    Visualization                       #
##########################################################
# Do not use OSG visualizer
*.useOsg = false
*.visualizer.osgVisualizer.typename = ""

# radios
# Some bug here, too
# *.visualizer.*.radioVisualizer[0].displayRadios = true
# *.visualizer.*.radioVisualizer[0].displayAntennaLobes = true
# *.visualizer.*.radioVisualizer[0].radioFilter = "**.satNic[0].radio"

# LinkLayer
# *.visualizer.*.dataLinkVisualizer[0].displayLinks = true

# NetworkLayer
# Some bug here
# *.visualizer.*.interfaceTableVisualizer[0].displayInterfaceTables = true
# *.visualizer.*.interfaceTableVisualizer[0].interfaceFilter = "*"

# Mobility
# *.visualizer.*.numMobilityVisualizers = 3
# *.visualizer.*.mobilityVisualizer[*].displayMobility = true # master switch
# *.visualizer.*.mobilityVisualizer[*].displayPositions = true
#*.visualizer.*.mobilityVisualizer[*].displayOrientations = true
#*.visualizer.*.mobilityVisualizer[*].displayVelocities = true
# *.visualizer.*.mobilityVisualizer[*].displayMovementTrails = true

# settings for the vehicles' mobility
#*.visualizer.*.mobilityVisualizer[0].displayVelocities = true
# *.visualizer.*.mobilityVisualizer[0].displayMovementTrails = true
# *.visualizer.*.mobilityVisualizer[0].moduleFilter = "*.node[*].mobility *.leo*[*].mobility"

# settings for the satNic antennas
# *.visualizer.*.mobilityVisualizer[1].moduleFilter = "**.satNic[*].radio.antenna.mobility"
# *.visualizer.*.mobilityVisualizer[1].orientationFillColor = "yellow"

# settings for the wlan antennas
# *.visualizer.*.mobilityVisualizer[2].moduleFilter = "**.wlan[*].radio.antenna.mobility"
# *.visualizer.*.mobilityVisualizer[2].orientationFillColor = "red"

##########################################################
#                        SOP                             #
##########################################################
*.sop.sumoNetXmlFile = xmldoc("Null-Island-5by5-grid.net.xml")
*.sop.mobility.updateFromDisplayString = false
*.sop.mobility.initFromDisplayString = false
*.sop.mobility.initialX = 525m
*.sop.mobility.initialY = 525m
*.sop.mobility.initialZ = 0m

##########################################################
#           satellite radio medium parameters            #
##########################################################
*.satelliteRadioMedium.typename = "UnitDiskRadioMedium"
*.satelliteRadioMedium.mediumLimitCache.minElevationAngleV2S = 8deg
*.satelliteRadioMedium.mediumLimitCache.disableS2SCommunication = true
*.satelliteRadioMedium.obstacleLoss.typename = "IdealObstacleLoss"

##########################################################
#               GlobalOracleMac parameters               #
##########################################################
*.globalOracleMac.tdmaSlotDuration = 0.001s

##########################################################
#                       Satellite                        #
##########################################################
# MOBILITY
*.leo*[*].mobility.updateInterval = 1s

# APPLICATION
*.leo*[*].numApps = 1
*.leo*[*].app[0].typename = "UdpBasicApp"
#*.leo*[*].app[0].typename = "UdpTxOverHorizon"
#*.leo*[*].app[0].enableHorizonThreshold = true
*.leo*[*].app[0].startTime = uniform(0s, this.sendInterval)
# stop sending packets before coolDownPeriod begins, such that packets in flight can be received before the simulation finishes.
*.leo*[*].app[0].stopTime = ${simTimeLimit}s - 5s
*.leo*[*].app[0].sendInterval = 1s
# maximum ethernet payload
*.leo*[*].app[0].messageLength = 1500B
*.leo*[*].app[0].destAddresses = "224.0.0.1"
*.leo*[*].app[0].localPort = 5000
*.leo*[*].app[0].destPort = 5000
*.leo*[*].app[0].messageLength = 10B
*.leo*[*].app[0].receiveBroadcast = true
*.leo*[*].app[0].joinLocalMulticastGroups = true

# IPV4
*.leo*[*].ipv4.arp.typename ="GlobalArp"
*.leo*[*].ipv4.configurator.typename = "HostAutoConfigurator"
*.leo*[*].ipv4.configurator.interfaces = "satNic0"
*.leo*[*].ipv4.configurator.mcastGroups = "224.0.0.1"

# Disable Loopback interface
*.leo*[*].numLoInterfaces = 0

# SATELLITE_NIC
*.leo*[*].numSatelliteNics = 1
*.leo*[*].satNic[0].typename = "SatelliteInterface"
# -- SATELLITE_NIC_MAC
*.leo*[*].satNic[0].mac.typename = "space_veins.modules.mac.OracleMac.OracleMac"
*.leo*[*].satNic[0].mac.bitrate = 100Mbps
*.leo*[*].satNic[0].mac.headerLength = 32B
*.leo*[*].satNic[0].mac.fullDuplex = true
*.leo*[*].satNic[0].mac.useAck = true
# -- SATELLITE_NIC_PHY
*.leo*[*].satNic[0].radio.typename = "UnitDiskRadio"
*.leo*[*].satNic[0].radio.radioMediumModule = "satelliteRadioMedium"
*.leo*[*].satNic[0].radio.antenna.mobilityModule = "^.^.^.mobility"
*.leo*[*].satNic[0].radio.transmitter.communicationRange = 9999999km
*.leo*[*].satNic[0].radio.transmitter.bitrate = 100Mbps
*.leo*[*].satNic[0].radio.transmitter.headerLength = 8bit
*.leo*[*].satNic[0].radio.transmitter.preambleDuration = 0s
*.leo*[*].satNic[0].radio.receiver.ignoreInterference = true


##########################################################
#                       SatCar                           #
##########################################################

# APPLICATION
*.node[*].numApps = 1
*.node[*].app[0].typename = "UdpSink"
*.node[*].app[0].localPort = 5000
*.node[*].app[0].receiveBroadcast = true

# IPV4
*.node[*].ipv4.arp.typename ="GlobalArp"
*.node[*].ipv4.configurator.typename = "HostAutoConfigurator"
*.node[*].ipv4.configurator.interfaces = "satNic0"
*.node[*].ipv4.configurator.mcastGroups = "224.0.0.1"

# Disable Loopback interface
*.node[*].numLoInterfaces = 0

# SATELITE_NIC
*.node[*].numSatelliteNics = 1
*.node[*].satNic[0].typename = "SatelliteInterface"
# -- SATELITE_NIC_MAC
*.node[*].satNic[0].mac.typename = "space_veins.modules.mac.OracleMac.OracleMac"
*.node[*].satNic[0].mac.bitrate = 10Mbps
*.node[*].satNic[0].mac.headerLength = 32B
*.node[*].satNic[0].mac.fullDuplex = true
*.node[*].satNic[0].mac.useAck = true
# -- SATELLITE_NIC_PHY
*.node[*].satNic[0].radio.typename = "UnitDiskRadio"
*.node[*].satNic[0].radio.radioMediumModule = "satelliteRadioMedium"
*.node[*].satNic[0].radio.antenna.mobilityModule = "notUsed"
*.node[*].satNic[0].radio.antenna.mobility.typename = "AttachedMobility"
*.node[*].satNic[0].radio.antenna.mobility.subjectModule = "^"
*.node[*].satNic[0].radio.antenna.mobility.mobilityModule = "^.^.^.^.mobility"
*.node[*].satNic[0].radio.antenna.mobility.constraintAreaMinX = 0m
*.node[*].satNic[0].radio.antenna.mobility.constraintAreaMinY = 0m
*.node[*].satNic[0].radio.antenna.mobility.constraintAreaMinZ = 0m
*.node[*].satNic[0].radio.antenna.mobility.constraintAreaMaxX = 2000m
*.node[*].satNic[0].radio.antenna.mobility.constraintAreaMaxY = 2000m
*.node[*].satNic[0].radio.antenna.mobility.constraintAreaMaxZ = 10m
*.node[*].satNic[0].radio.antenna.mobility.offsetZ = ${satNicZoffset=1.895}m
*.node[*].satNic[0].radio.transmitter.communicationRange = 9999999km
*.node[*].satNic[0].radio.transmitter.bitrate = 10Mbps
*.node[*].satNic[0].radio.transmitter.headerLength = 8bit
*.node[*].satNic[0].radio.transmitter.preambleDuration = 0s
*.node[*].satNic[0].radio.receiver.ignoreInterference = true

# WLAN_NIC
*.node[*].numWlanInterfaces = 0

##########################################################
#                    Statistics                          #
##########################################################
# Scalars
*.leo*[*].app[0].packetSent:count.scalar-recording = true
*.node[*].app[0].packetReceived:count.scalar-recording = true
*.leo*[*].mobility.*.scalar-recording = true
*.leo*[*].vehicleStatistics.sendSatellitePacketsOverMinElevationAngle:count.scalar-recording = true
*.node[*].vehicleStatistics.ageOfInformation:last.scalar-recording = true
*.globalStatistics.packetReceptionHash:last.scalar-recording = true
*.globalStatistics.totalAddedTraciModules:count.scalar-recording = true
*.globalStatistics.totalRemovedTraciModules:count.scalar-recording = true
*.globalStatistics.activeTraciModules:last.scalar-recording = true
# Vectors
*.leo*[*].mobility.*.vector-recording = true
*.node[*].vehicleStatistics.ageOfInformation:vector.vector-recording = true
*.globalStatistics.packetReceptionHash:vector.vector-recording = true
*.globalStatistics.activeTraciModules:vector.vector-recording = true

# Disable all remaining result recording
**.scalar-recording = false
**.vector-recording = false
# ----------------------------------------------------------------------------------------------------------------------------------
##########################################################
#                  End of General                        #
##########################################################
